<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/styles.css" />
    <!--JavaScript Einbettung am Ende vom body-->
    <title>Taskboard</title>
    <!--
        Checkbox zum markieren der Aufgaben
            if >1 Löschen möglich

        Prio Kreis eingefärbt 
            rot = 1
            gelb = 2
            grün = 3
    -->
</head>
<body>
    <header>
        <div>
            <img src="" alt="Logo">
            <h1>Taskboard</h1>
        </div>
        <div>
            <button id="Icon">
                <!--Auswahl Löschen-->
                    <svg 
                        viewBox="0 0 24 24" 
                        fill="currentColor" 
                        xmlns="http://www.w3.org/2000/svg">
                        <path 
                            d="M7 4V2H17V4H22V6H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V6H2V4H7ZM6 6V20H18V6H6ZM9 9H11V17H9V9ZM13 9H15V17H13V9Z"
                        />
                    </svg>
            </button>
            <button id="Icon">
                <!--Neue Aufgabe-->
                    <svg 
                        viewBox="0 0 24 24" 
                        fill="currentColor" 
                        xmlns="http://www.w3.org/2000/svg">
                        <path 
                            d="M20 2C21.6569 2 23 3.34315 23 5V7H21V19C21 20.6569 19.6569 22 18 22H4C2.34315 22 1 20.6569 1 19V17H17V19C17 19.5128 17.386 19.9355 17.8834 19.9933L18 20C18.5128 20 18.9355 19.614 18.9933 19.1166L19 19V4H6C5.48716 4 5.06449 4.38604 5.00673 4.88338L5 5V15H3V5C3 3.34315 4.34315 2 6 2H20Z"
                        />
                    </svg>
            </button>
        </div>
    </header>
    <main>
        <table id="Liste">
            <thead>
                <tr>
                    <th colspan="2" rowspan="2"></th>
                    <th colspan="2">Termin</th>
                    <th rowspan="2">Bezeichnung</th>
                    <th colspan="2" rowspan="2"></th>
                </tr>
                <tr>
                    <th>KW</th> <!--KW soll automatisch angezeigt werden-->
                    <th>Datum</th>
                </tr>
            </thead>
            <tbody id="tabelleBody">
            <!--1-->
                <tr>
                    <td> <!--Checkbox-->
                        <input 
                            type="checkbox" 
                            id="task1" 
                            name="task1" 
                            value=""
                        >
                    </td>
                    <td id="prio"><!--Prio-->
                        <svg id="circle"
                            width="30"
                            viewBox="0 0 24 24" 
                            fill="currentColor" 
                            xmlns="http://www.w3.org/2000/svg">
                            <path 
                                d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                            />
                        </svg>
                    </td> 
                    <td id="kw"> </td>
                    <td id="termin"> </td>
                    <td id="bezeichnung"> </td>
                    <td> <!--buttons-->
                        <!--Details/Info-->
                        <button id="Icon">
                            <svg 
                                viewBox="0 0 24 24" 
                                fill="currentColor" 
                                xmlns="http://www.w3.org/2000/svg">
                                <path 
                                    d="M12 6C12.8284 6 13.5 5.32843 13.5 4.5C13.5 3.67157 12.8284 3 12 3C11.1716 3 10.5 3.67157 10.5 4.5C10.5 5.32843 11.1716 6 12 6ZM9 10H11V18H9V20H15V18H13V8H9V10Z"
                                />
                            </svg> 
                        </button>             
                    </td>
                    <td>
                        <!--Bearbeiten-->
                        <button id="Icon">
                            <svg 
                                viewBox="0 0 24 24" 
                                fill="currentColor" 
                                xmlns="http://www.w3.org/2000/svg">
                                <path 
                                    d="M5.32943 3.27158C6.56252 2.8332 7.9923 3.10749 8.97927 4.09446C10.1002 5.21537 10.3019 6.90741 9.5843 8.23385L20.293 18.9437L18.8788 20.3579L8.16982 9.64875C6.84325 10.3669 5.15069 10.1654 4.02952 9.04421C3.04227 8.05696 2.7681 6.62665 3.20701 5.39332L5.44373 7.63C6.02952 8.21578 6.97927 8.21578 7.56505 7.63C8.15084 7.04421 8.15084 6.09446 7.56505 5.50868L5.32943 3.27158ZM15.6968 5.15512L18.8788 3.38736L20.293 4.80157L18.5252 7.98355L16.7574 8.3371L14.6361 10.4584L13.2219 9.04421L15.3432 6.92289L15.6968 5.15512ZM8.97927 13.2868L10.3935 14.7011L5.09018 20.0044C4.69966 20.3949 4.06649 20.3949 3.67597 20.0044C3.31334 19.6417 3.28744 19.0699 3.59826 18.6774L3.67597 18.5902L8.97927 13.2868Z"
                                />
                            </svg>  
                        </button>                 
                    </td>
                </tr>
            </tbody> 
        </table>
        <div id="ticket-container">
            <!--TestContainer-->
        </div>
    </main>
    <footer>
            <p>(c) 2026</p>
            <button type="button">Beenden</button><!--sinnig?-->
    </footer>
    <!--JavaScript Einbettung-->
    <script src="public/taskboard.js"></script>
</body>
</html>
