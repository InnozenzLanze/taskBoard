<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/styles.css" />
    <!--JavaScript Einbettung am Ende vom body-->
    <title>Taskboard</title>
    <!--
        Checkbox zum markieren der Aufgaben
            if >1 Löschen möglich

        Prio Kreis eingefärbt 
            rot = 1
            gelb = 2
            grün = 3
    -->
</head>
<body>
    <header>
        <div>
            <img src="" alt="Logo">
            <h1>Taskboard</h1>
        </div>
        <div>
            <button id="Icon">
                <!--Auswahl Löschen-->
                    <svg 
                        viewBox="0 0 24 24" 
                        fill="currentColor" 
                        xmlns="http://www.w3.org/2000/svg">
                        <path 
                            d="M7 4V2H17V4H22V6H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V6H2V4H7ZM6 6V20H18V6H6ZM9 9H11V17H9V9ZM13 9H15V17H13V9Z"
                        />
                    </svg>
            </button>
            <button id="Icon">
                <!--Neue Aufgabe-->
                    <svg 
                        viewBox="0 0 24 24" 
                        fill="currentColor" 
                        xmlns="http://www.w3.org/2000/svg">
                        <path 
                            d="M20 2C21.6569 2 23 3.34315 23 5V7H21V19C21 20.6569 19.6569 22 18 22H4C2.34315 22 1 20.6569 1 19V17H17V19C17 19.5128 17.386 19.9355 17.8834 19.9933L18 20C18.5128 20 18.9355 19.614 18.9933 19.1166L19 19V4H6C5.48716 4 5.06449 4.38604 5.00673 4.88338L5 5V15H3V5C3 3.34315 4.34315 2 6 2H20Z"
                        />
                    </svg>
            </button>
        </div>
    </header>
    <main>
        <table id="Liste">
            <thead>
                <tr>
                    <th colspan="2" rowspan="2"></th>
                    <th colspan="2">Termin</th>
                    <th rowspan="2">Bezeichnung</th>
                    <th colspan="2" rowspan="2"></th>
                </tr>
                <tr>
                    <th>KW</th> <!--KW soll automatisch angezeigt werden-->
                    <th>Datum</th>
                </tr>
            </thead>
            <tbody id="tabelleBody">
            <!--in JavaScript-->
                
            </tbody> 
        </table>
    </main>
    <footer>
            <p>(c) 2026</p>
            <button type="button">Beenden</button><!--sinnig?-->
    </footer>
    <!--JavaScript Einbettung-->
    <script src="public/taskboard.js"></script>
</body>
</html>
